<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="xgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="480" height="160" rx="16" fill="url(#bg)"/>

  <!-- Window icon -->
  <g transform="translate(28, 20)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect width="120" height="92" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect width="120" height="28" rx="10" fill="#0f172a"/>
    <rect y="18" width="120" height="10" fill="#0f172a"/>
    <!-- Traffic lights -->
    <circle cx="16" cy="14" r="5" fill="#ef4444"/>
    <circle cx="32" cy="14" r="5" fill="#f59e0b"/>
    <circle cx="48" cy="14" r="5" fill="#22c55e"/>
    <!-- Window close X mark -->
    <line x1="30" y1="44" x2="90" y2="96" stroke="url(#xgrad)" stroke-width="9" stroke-linecap="round"/>
    <line x1="90" y1="44" x2="30" y2="96" stroke="url(#xgrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Inner lines (highlight) -->
    <line x1="30" y1="44" x2="90" y2="96" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="90" y1="44" x2="30" y2="96" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- App name -->
  <text x="172" y="72" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="36" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">CloseApps</text>
  <text x="172" y="110" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="36" font-weight="300" fill="#94a3b8" letter-spacing="-0.5">Open</text>

  <!-- Tagline -->
  <text x="172" y="138" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" fill="#475569">Fecha aplicativos abertos via CLI · Windows</text>

  <!-- Version badge -->
  <rect x="172" y="147" width="58" height="0" rx="4" fill="#1d4ed8" opacity="0"/>
</svg>
